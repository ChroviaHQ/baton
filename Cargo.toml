[workspace]
resolver = "3"
members = ["crates/baton-core", "src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ChroviaHQ/baton"
rust-version = "1.85"

[workspace.dependencies]
baton-core = { path = "crates/baton-core" }
base64 = "0.23"
httparse = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
